name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          python3 -m py_compile \
            plugin/rosetta.py \
            tools/ida_gdb_cfg.py \
            tests/rsp_probe.py \
            examples/fallingwhale_helper.py
      - name: Config patcher (idempotent, synthetic fixture)
        run: |
          cat > /tmp/dbg_gdb.cfg <<'CFG'
          {
            "i386:x86-64":
            {
              "org.gnu.gdb.i386.core":
              {
                "title": "General registers"
              }
            }
          }
          CFG
          if python3 tools/ida_gdb_cfg.py --file /tmp/dbg_gdb.cfg --check; then
            echo "unexpectedly patched before apply"; exit 1
          fi
          python3 tools/ida_gdb_cfg.py --file /tmp/dbg_gdb.cfg --apply
          python3 tools/ida_gdb_cfg.py --file /tmp/dbg_gdb.cfg --check
          python3 tools/ida_gdb_cfg.py --file /tmp/dbg_gdb.cfg --apply
          python3 tools/ida_gdb_cfg.py --file /tmp/dbg_gdb.cfg --revert
          if python3 tools/ida_gdb_cfg.py --file /tmp/dbg_gdb.cfg --check; then
            echo "revert did not restore the pristine file"; exit 1
          fi

  launcher:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build universal launcher
        run: |
          make -C launcher
          lipo -info launcher/noaslr
          launcher/noaslr --version
          launcher/noaslr --help
